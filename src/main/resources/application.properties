#cloud properties
# Connects to Cloud SQL (MySQL 8.0, upgrading to 8.4) through the Cloud SQL Java connector (socket factory).
# Credentials come from the DB_USER / DB_PASS environment variables (see src/main/appengine/app.yaml).
# The defaults keep the legacy root login working until the dedicated app user exists.
spring.datasource.url=jdbc:mysql:///migration?cloudSqlInstance=bellbooks-backend:us-central1:bellbooks-sql-instance&socketFactory=com.google.cloud.sql.mysql.SocketFactory
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.profiles.active=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=true
debug=false

